name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install dependencies
        run: |
          cd ../..
          npm install
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios
      - name: Build Xcode Archive
        run: |
          cd ios
          xcodebuild -workspace *.xcworkspace -scheme $(xcodebuild -list -json | jq -r '.workspace.schemes[0]') -configuration Release -destination 'generic/platform=iOS' -archivePath app.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ios/app.xcarchive/Products/Applications/*.app Payload/
          zip -r NutAI.ipa Payload
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutAI-IPA
          path: apps/mobile/NutAI.ipa
